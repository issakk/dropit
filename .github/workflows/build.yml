name: build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build windows-x64
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Publish single-file exe
        shell: pwsh
        run: |
          $dotnetArgs = @('publish', 'src/DropLite/DropLite.csproj', '-c', 'Release', '-o', 'publish')
          # Tag pushes (v1.2.3) stamp the exe version; branch builds keep the csproj default.
          if ($env:GITHUB_REF_NAME -like 'v*') {
            $dotnetArgs += '/p:Version=' + $env:GITHUB_REF_NAME.Substring(1)
          }
          & dotnet @dotnetArgs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: DropLite-win-x64-${{ github.run_number }}
          path: publish/DropLite.exe
          if-no-files-found: error

      - name: Package release zip
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: Compress-Archive -Path publish/DropLite.exe -DestinationPath DropLite-win-x64.zip -Force

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: DropLite-win-x64.zip
          generate_release_notes: true
